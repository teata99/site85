<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>San San Project - List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">

  <style>
    #post-content {
      line-height: 1.6;     
      font-size: 1.1rem;    
      white-space: pre-wrap; 
      word-break: break-all; 
      color: #333;
    }
  </style>

</head>

<body class="bg-light">

<div id="topbar"></div>

<div class="d-flex">
  <div id="sidebar"></div>

  <div class="container mt-5">
      <h2 class="mb-4 text-primary">FastAPI DB 연동 테스트</h2>
      <p class="text-muted">Vercel Postgres(Supabase)로부터 데이터를 조회합니다.</p>

      <div class="d-grid gap-2 mb-4">
          <button id="db-check-btn" class="btn btn-success btn-lg">DB 연결 상태 확인</button>
      </div>

      <div id="result-box" class="card shadow-sm p-3">
          <p class="text-muted mb-0">버튼을 눌러 DB 상태를 확인하세요.</p>
      </div>
  </div>

</div>      

<script>
fetch("/topbar.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("topbar").innerHTML = html;
  });

fetch("/sidebar.html")
  .then(res => res.text())
  .then(html => {
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = html;

    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute("href") === location.pathname.split('/').pop()) {
        link.classList.add('active');
      }
    });
  });
</script>  

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    const dbBtn = document.getElementById('db-check-btn');
    const resultBox = document.getElementById('result-box');

    async function checkDB() {
        resultBox.innerHTML = '<div class="spinner-border text-success" role="status"></div> <span class="ms-2">DB 조회 중...</span>';

        try {
            const response = await fetch('/api/fastapi/fastapi02/db-check');

            if (!response.ok) {
                throw new Error(`HTTP 에러 발생! 상태코드: ${response.status}`);
            }

            const data = await response.json();

            resultBox.innerHTML = `
                <div class="alert alert-success">
                    <h5 class="alert-heading">🎉 연결 성공!</h5>
                    <p class="mb-0">서버 메시지: ${data.message}</p>
                </div>
                <ul class="list-group mt-2">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        현재 등록된 데이터 개수
                        <span class="badge bg-primary rounded-pill">${data.data_count}</span>
                    </li>
                </ul>
            `;
        
        } catch (error) {
            resultBox.innerHTML = `
                <div class="alert alert-danger">
                    <h5 class="alert-heading">❌ 연결 실패</h5>
                    <p class="mb-0">${error.message}</p>
                </div>
            `;
            console.error('Fetch error:', error);
        }
    }

    dbBtn.addEventListener('click', checkDB);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
