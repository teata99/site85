<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>San San Project - List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">

  <style>
    #post-content {
      line-height: 1.6;     
      font-size: 1.1rem;    
      white-space: pre-wrap; 
      word-break: break-all; 
      color: #333;
    }
  </style>

</head>

<body class="bg-light">

<div id="topbar"></div>

<div class="d-flex">
  <div id="sidebar"></div>

  <div class="container">
    <h2 class="mb-4 text-primary">FastAPI 서버리스 테스트</h2>
    <p class="text-muted">Vercel에 배포된 파이썬 함수로부터 데이터를 가져옵니다.</p>

    <div class="d-grid gap-2 mb-4">
        <button id="fetch-btn" class="btn btn-primary btn-lg">유저 목록 가져오기</button>
    </div>

    <div id="result-box">
        <p class="text-muted mb-0">버튼을 눌러 결과를 확인하세요.</p>
    </div>
  </div>

</div>      

<script>
fetch("/topbar.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("topbar").innerHTML = html;
  });

fetch("/sidebar.html")
  .then(res => res.text())
  .then(html => {
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = html;

    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute("href") === location.pathname.split('/').pop()) {
        link.classList.add('active');
      }
    });
  });
</script>  

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    const fetchBtn = document.getElementById('fetch-btn');
    const resultBox = document.getElementById('result-box');

    async function getUserData() {
        resultBox.innerHTML = '<span class="loading">데이터를 불러오는 중...</span>';

        try {
            const response = await fetch('/api/fastapi/fastapi01/');

            if (!response.ok) {
                throw new Error(`HTTP 에러 발생! 상태코드: ${response.status}`);
            }

            const data = await response.json();

            resultBox.innerHTML = `
                <h5 class="text-success">성공!</h5>
                <pre class="bg-light p-3 mt-2 border rounded"><code>${JSON.stringify(data, null, 2)}</code></pre>
            `;
        
        } catch (error) {
            resultBox.innerHTML = `
                <h5 class="text-danger">오류 발생</h5>
                <p class="text-small">${error.message}</p>
            `;
            console.error('Fetch error:', error);
        }
    }

    fetchBtn.addEventListener('click', getUserData);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
