<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>San San Project - List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">

  <style>
    #post-content {
      line-height: 1.6;     
      font-size: 1.1rem;    
      white-space: pre-wrap; 
      word-break: break-all; 
      color: #333;
    }
  </style>

</head>

<body class="bg-light">

<div id="topbar"></div>

<div class="d-flex">
  <div id="sidebar"></div>

  <div class="container mt-5" style="max-width: 600px;">
      <div class="text-center mb-5">
          <p class="text-muted">FastAPI & Google OAuth 2.0 연동</p>
      </div>

      <div id="login-section" class="card auth-card shadow-sm p-4 text-center">
          <h4 class="mb-4">서비스를 시작하려면 로그인하세요</h4>
          <div class="d-grid">
              <a href="/fastapi/fastapi03/login" class="btn btn-outline-dark btn-lg d-flex align-items-center justify-content-center gap-2">
                  <i class="bi bi-google"></i> Google로 계속하기
              </a>
          </div>
          <p class="mt-3 small text-muted">Vercel Serverless Function을 통해 안전하게 인증됩니다.</p>
      </div>

      <div id="app-content">
          <div class="card shadow-sm p-3 mb-4 border-0 bg-white d-flex flex-row align-items-center justify-content-between">
              <div class="d-flex align-items-center gap-3">
                  <img id="user-img" src="" alt="Profile" class="user-avatar shadow-sm">
                  <div>
                      <h6 id="user-name" class="mb-0 fw-bold">사용자 이름</h6>
                      <small id="user-email" class="text-muted">user@example.com</small>
                  </div>
              </div>
              <a href="/fastapi/fastapi03/logout" class="btn btn-sm btn-outline-danger">로그아웃</a>
          </div>
      </div>
  </div>

</div>      

<script>
fetch("/topbar.html")
  .then(res => res.text())
  .then(html => {
    document.getElementById("topbar").innerHTML = html;
  });

fetch("/sidebar.html")
  .then(res => res.text())
  .then(html => {
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = html;

    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute("href") === location.pathname.split('/').pop()) {
        link.classList.add('active');
      }
    });
  });
</script>  

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
<script>
    async function checkAuth() {
        try {
            const response = await fetch('/fastapi/fastapi03/read'); 
            if (response.ok) {
                const user = await response.json();
                showApp(user);
            }
        } catch (error) {
            console.log("로그인이 필요합니다.");
        }
    }

    function showApp(user) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        
        document.getElementById('user-img').src = user.picture || 'https://via.placeholder.com/48';
        document.getElementById('user-name').innerText = user.name;
        document.getElementById('user-email').innerText = user.email;
    }

    checkAuth();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
